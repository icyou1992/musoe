# wasm 타깃은 SIMD128을 항상 켠다 (설계 §2 — 비FMA 기본, relaxed-simd는 별도 feature로만).
# 강등이 필요한 환경은 이 플래그를 끄는 명시적 빌드를 쓴다 — 조용한 폴백 금지(설계 §6).
[target.wasm32-wasip1]
runner = ["node", "--no-warnings", "/home/icyou/workspace/musoe/scripts/wasi-run.mjs"]
rustflags = ["-C", "target-feature=+simd128"]

[target.wasm32-unknown-unknown]
# **브라우저 타깃은 panic=abort**다. wasm에서 unwind는 어차피 trap이라 되살릴 수 없고,
# unwind 테이블만 산출물을 키운다. 바인딩은 fallible 경로(`try_*`)만 쓰므로 정상
# 실패는 오류 코드로 나가고, 여기 걸리는 것은 진짜 버그뿐이다.
# (wasip1 타깃은 그대로 둔다 — 게이트의 `should_panic` 테스트가 unwind를 필요로 한다.)
rustflags = ["-C", "target-feature=+simd128", "-C", "panic=abort"]
