[workspace]
resolver = "2"
members = [
    "crates/maru-math",
    "crates/maru-collide",
    "crates/maru-dynamics",
    "crates/maru-bench",
    "crates/maru-wasm",
]
# 대조 벤치는 별도 워크스페이스다 — 외부 엔진(rapier)을 엔진 의존성 그래프와 게이트에
# 들이지 않기 위해서다. 실행: compare/README.md
exclude = ["compare"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
wide = "0.7"

# 결정론 규율(설계 §8): 재결합 최적화 금지 — 기본 프로파일 유지, fast-math 계열 플래그 전면 배제.
[profile.release]
lto = "thin"
codegen-units = 1
