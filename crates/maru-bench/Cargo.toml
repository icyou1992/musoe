[package]
name = "maru-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Maru bench harness (M0: SIMD math microbenches, native + wasm)"

[features]
# maru-dynamics의 PCM 상한 계측 팔을 여는 통로 (기본 off).
pcm-probe = ["maru-dynamics/pcm-probe"]
solve-probe = ["maru-dynamics/solve-probe"]

[dependencies]
maru-math = { path = "../maru-math" }
maru-collide = { path = "../maru-collide" }
maru-dynamics = { path = "../maru-dynamics" }
wide = { workspace = true }
