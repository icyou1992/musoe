[package]
name = "maru-dynamics"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Maru rigid body dynamics: TGS-soft solver, islands, sleeping, joints"

[features]
# **상한 계측 전용 팔** (`MARU_PCM_PROBE`). 기본 off — 프로덕션 빌드에는 컴파일되지 않는다.
# 켜면 환경변수로 warm start를 끌 수 있으므로 벤치 측정에만 쓴다(교차검수 rev_1e72bc07).
pcm-probe = []
# bias/relax 게더 미스 비용 계측 팔 (`MARU_SOLVE_PROBE`). 결과를 버리므로 물리는 불변.
solve-probe = []

[dependencies]
maru-math = { path = "../maru-math" }
maru-collide = { path = "../maru-collide" }
wide = { workspace = true }

[dev-dependencies]
# FP 환경 가드가 공회전이 아님을 증명하려면 환경을 깨뜨려 봐야 한다.
maru-math = { path = "../maru-math", features = ["test-hooks"] }
